# Fork overlay: Brave bot browser, Azure Foundry Claude and the Grok Bot behaviour flags.
# docker compose --env-file .env -f infra/compose/docker-compose.yml \
#   -f infra/compose/docker-compose.grokbot.yml up -d --build
x-grokbot-environment: &grokbot-environment
  ANTHROPIC_BASE_URL:
  RAKAZO_GROKBOT:
  RAKAZO_GROKBOT_HELPER_MODEL:

services:
  computer:
    build:
      args:
        BROWSER: ${RAKAZO_COMPUTER_BROWSER:-brave}
  api:
    environment: *grokbot-environment
  worker:
    environment: *grokbot-environment
